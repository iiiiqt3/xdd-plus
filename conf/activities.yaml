#
# ===================== 验证规则说明 =====================
# 验证规则支持以下类型（可组合多个）：
#   regex          - 正则表达式验证，需配置 pattern
#   forbidden_chars - 禁止包含某些字符，需配置 chars
#   required_chars  - 必须包含某些字符，需配置 chars
#   no_chinese      - 不能包含汉字
#   not_empty       - 不能为空
#   min_length      - 最小长度，需配置 length
#   max_length      - 最大长度，需配置 length
#   exact_length    - 固定长度，需配置 length
#   prefix          - 必须以某字符串开头，需配置 value
#   suffix          - 必须以某字符串结尾，需配置 value
#   contains        - 必须包含某子串，需配置 value
#   not_all_same    - 不能全是相同字符



