<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用宝协议 · 用户中心</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f0f2f5;
            --sidebar-bg: #111827;
            --sidebar-hover: #1f2937;
            --sidebar-active: #312e81;
            --sidebar-text: #9ca3af;
            --sidebar-text-active: #c7d2fe;
            --sidebar-border: #374151;
            --card: #ffffff;
            --card-border: #e5e7eb;
            --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --success: #059669;
            --success-light: #ecfdf5;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --text: #0f172a;
            --text-muted: #94a3b8;
            --radius: 12px;
            --radius-sm: 8px;
        }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.5;
        }
        .layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
        .sidebar {
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
            background: var(--sidebar-bg); display: flex; flex-direction: column;
        }
        .brand { padding: 24px 22px 20px; border-bottom: 1px solid var(--sidebar-border); }
        .brand h1 { font-size: 22px; font-weight: 800; color: #f9fafb; }
        .brand p { color: var(--sidebar-text); font-size: 12px; margin-top: 6px; }
        .menu-group { padding: 16px 12px 6px; }
        .menu { display: grid; gap: 2px; }
        .menu a, .menu button {
            display: flex; align-items: center; gap: 10px; width: 100%;
            min-height: 42px; border: none; border-radius: var(--radius-sm);
            padding: 0 14px; background: transparent; color: var(--sidebar-text);
            cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none;
            transition: all 0.15s ease; text-align: left;
        }
        .menu a:hover, .menu button:hover { background: var(--sidebar-hover); color: #d1d5db; }
        .menu a.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
        .main { min-width: 0; padding: 24px; }
        .topbar {
            display: flex; justify-content: space-between; align-items: center; gap: 16px;
            margin-bottom: 20px; padding: 18px 24px; border-radius: var(--radius);
            background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
            flex-wrap: wrap;
        }
        .topbar h2 { font-size: 22px; font-weight: 800; }
        .topbar .muted { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            border-radius: var(--radius-sm); background: #f8fafc; border: 1px solid #e2e8f0; font-size: 12px;
        }
        .chip strong { font-weight: 700; }
        .chip.ok { background: var(--success-light); border-color: #a7f3d0; color: var(--success); }
        .chip.bad { background: var(--danger-light); border-color: #fecaca; color: var(--danger); }
        .btn {
            border: none; border-radius: var(--radius-sm); cursor: pointer;
            padding: 9px 16px; min-height: 38px; font-size: 13px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #4338ca; }
        .btn-secondary { background: #fff; color: var(--text); border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #f8fafc; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #b91c1c; }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-sm { padding: 5px 10px; min-height: 30px; font-size: 12px; }
        .panel {
            background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
            box-shadow: var(--card-shadow); margin-bottom: 16px; overflow: hidden;
        }
        .panel-head {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            padding: 14px 18px; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap;
        }
        .panel-head h3 { font-size: 15px; font-weight: 800; }
        .panel-body { padding: 16px 18px; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .acc-item {
            border: 1px solid #e2e8f0; border-radius: var(--radius-sm); padding: 12px;
            background: #f8fafc; cursor: pointer; transition: all 0.15s; text-align: left; width: 100%;
        }
        .acc-item:hover { border-color: #c7d2fe; background: #fff; }
        .acc-item.selected { border-color: var(--primary); background: var(--primary-light); }
        .acc-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .acc-meta { font-size: 11px; color: var(--text-muted); word-break: break-all; }
        .tag {
            display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-top: 6px;
        }
        .tag.ok { background: var(--success-light); color: var(--success); }
        .tag.bad { background: var(--danger-light); color: var(--danger); }
        .empty { text-align: center; color: var(--text-muted); padding: 28px 16px; font-size: 13px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .form-item { display: flex; flex-direction: column; gap: 6px; }
        .form-item.full { grid-column: 1 / -1; }
        .form-item label { font-size: 12px; font-weight: 700; color: #64748b; }
        .form-item input, .form-item select, .form-item textarea {
            padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: var(--radius-sm);
            font-size: 13px; outline: none;
        }
        .form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: var(--primary); }
        .form-item textarea { min-height: 120px; resize: vertical; font-family: Consolas, monospace; }
        .result-box {
            margin-top: 14px; background: #1e293b; color: #e2e8f0; border-radius: var(--radius-sm);
            padding: 14px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.55;
            max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word;
        }
        .result-box.error { color: #fca5a5; }
        .hidden { display: none !important; }
        .modal-mask {
            position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: none;
            align-items: center; justify-content: center; z-index: 200; padding: 20px;
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: min(380px, 100%); background: #fff; border-radius: var(--radius);
            padding: 22px; border: 1px solid var(--card-border); box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        .modal h3 { font-size: 17px; margin-bottom: 6px; }
        .modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
        .qr-box {
            min-height: 200px; display: grid; place-items: center; background: #f8fafc;
            border: 1px solid #e2e8f0; border-radius: var(--radius-sm); margin-bottom: 14px;
        }
        .qr-box img { width: 180px; height: 180px; object-fit: contain; }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>XDD</h1>
            <p>用户中心</p>
        </div>
        <div class="menu-group">
            <div class="menu">
                <a href="/portal">← 返回用户中心</a>
                <a href="/portal/yyb" class="active">📲 应用宝协议</a>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h2>应用宝协议</h2>
                <div class="muted">管理绑定账号与小程序 API 调用</div>
                <div class="chips">
                    <span class="chip" id="healthChip"><strong id="healthText">检测中</strong></span>
                    <span class="chip">积分 <strong id="coinVal">-</strong></span>
                    <span class="chip">扫码消耗 <strong id="scanCostVal">-</strong></span>
                    <span class="chip">账号 <strong id="accountCount">0</strong></span>
                </div>
            </div>
            <div class="toolbar">
                <button class="btn btn-secondary" id="reloadBtn" type="button">刷新</button>
                <button class="btn btn-primary" id="scanBtn" type="button">扫码添加</button>
            </div>
        </div>

        <section class="panel">
            <div class="panel-head">
                <h3>我的账号</h3>
                <div class="toolbar">
                    <button class="btn btn-secondary btn-sm" id="refreshBtn" type="button">刷新存活</button>
                    <button class="btn btn-secondary btn-sm" id="resyncBtn" type="button">同步资料</button>
                    <button class="btn btn-danger btn-sm" id="deleteBtn" type="button">删除</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="account-grid" id="accountGrid"><div class="empty">加载中…</div></div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h3>API 调用</h3>
                <span class="muted" style="font-size:12px;" id="selectedLabel">未选择账号</span>
            </div>
            <div class="panel-body">
                <div class="form-grid">
                    <div class="form-item">
                        <label>能力</label>
                        <select id="featureSel">
                            <option value="getCode">getCode</option>
                            <option value="getPhoneNumber">getPhoneNumber</option>
                            <option value="operateWxData">operateWxData</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>AppID</label>
                        <input id="appidInput" value="wx91d27dbf599dff74" autocomplete="off">
                    </div>
                    <div class="form-item full hidden" id="payloadGroup">
                        <label>请求 JSON</label>
                        <textarea id="payloadInput" spellcheck="false">{"api_name":"getUserInfo","data":{},"env":1}</textarea>
                    </div>
                </div>
                <div class="toolbar" style="margin-top:14px;">
                    <button class="btn btn-primary" id="callBtn" type="button">执行调用</button>
                    <button class="btn btn-secondary" id="clearBtn" type="button">清空结果</button>
                    <button class="btn btn-secondary" id="copyBtn" type="button">复制结果</button>
                </div>
                <pre class="result-box" id="resultBox">选择账号后执行调用，结果将显示在这里。</pre>
            </div>
        </section>
    </main>
</div>

<div class="modal-mask" id="qrModal">
    <div class="modal">
        <h3>微信扫码</h3>
        <p id="qrHint">请使用微信扫描二维码</p>
        <div class="qr-box" id="qrBox">生成中…</div>
        <div class="toolbar" style="justify-content:flex-end;">
            <button class="btn btn-secondary" id="qrCloseBtn" type="button">关闭</button>
        </div>
    </div>
</div>

<script src="/vweb/js/clipboard.js?v=4"></script>
<script>
const API = '/api/portal/yyb';
const state = { accounts: [], selectedKey: '', lastResult: '', scanSessionId: '', scanTimer: null, scanPolling: false };
const $ = id => document.getElementById(id);

function copyFail(msg) { alert(msg); }
function copyText(text, btn) {
    if (window.YybClipboard) return YybClipboard.copyWithFeedback(text, btn, copyFail);
    return false;
}
if (window.YybClipboard) YybClipboard.installCopyDelegation(copyFail);

function attrEsc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function request(path, options = {}) {
    const res = await fetch(API + path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-Request-Source': 'web', ...(options.headers || {}) },
        ...options,
    });
    if (res.redirected && res.url.includes('/portal/login')) {
        location.href = '/portal/login';
        throw new Error('未登录');
    }
    const data = await res.json();
    if (data.code !== 0) throw new Error(data.msg || '请求失败');
    return data.data;
}

function accountName(a) { return a.nickname || a.openid || '未命名'; }

function statusTag(s) {
    if (s === 'alive' || s === 'online') return '<span class="tag ok">可用</span>';
    if (s === 'dead' || s === 'offline' || s === 'expired') return '<span class="tag bad">已失效</span>';
    return '<span class="tag">' + esc(s || '未知') + '</span>';
}

function accountKey(acc) {
    if (acc.bindingId) return String(acc.bindingId);
    return String(acc.openid || '').trim();
}

function accountRef(acc) { return accountKey(acc); }

function setResult(val, err) {
    const text = typeof val === 'string' ? val : JSON.stringify(val, null, 2);
    state.lastResult = text;
    $('resultBox').textContent = text;
    $('resultBox').classList.toggle('error', !!err);
}

async function withAccountAction(btn, loadingLabel, resultHint, action) {
    if (!btn || btn.disabled) return;
    const prev = btn.textContent;
    const peer = [$('refreshBtn'), $('resyncBtn')].filter(b => b && b !== btn);
    btn.disabled = true;
    peer.forEach(b => { b.disabled = true; });
    btn.textContent = loadingLabel;
    setResult(resultHint, false);
    try {
        await action();
    } finally {
        btn.disabled = false;
        btn.textContent = prev;
        peer.forEach(b => { b.disabled = false; });
    }
}

function selectedAccount() { return state.accounts.find(a => accountKey(a) === state.selectedKey); }

function syncSelected() {
    const a = selectedAccount();
    $('selectedLabel').textContent = a ? ('当前：' + accountName(a)) : '未选择账号（请先点击上方账号卡片）';
    document.querySelectorAll('.acc-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.key === state.selectedKey);
    });
}

function qrImgSrc(b64) {
    if (!b64) return '';
    if (String(b64).startsWith('data:')) return b64;
    return 'data:image/png;base64,' + b64;
}

function formatUin(acc) {
    const u = acc && acc.uin;
    if (u != null && u !== '' && Number(u) > 0) return String(u);
    return '';
}

function renderAccounts() {
    const grid = $('accountGrid');
    $('accountCount').textContent = String(state.accounts.length);
    if (!state.accounts.length) {
        grid.innerHTML = '<div class="empty">暂无账号，请点击右上角「扫码添加」</div>';
        state.selectedKey = '';
        syncSelected();
        return;
    }
    if (!state.accounts.some(a => accountKey(a) === state.selectedKey)) {
        state.selectedKey = accountKey(state.accounts[0]);
    }
    grid.innerHTML = state.accounts.map(acc => {
        const raw = String(acc.openid || '');
        const uin = formatUin(acc);
        return `<div class="acc-item" data-key="${attrEsc(accountKey(acc))}">
            <div class="acc-name">${esc(accountName(acc))}</div>
            <div class="yyb-acc-openid-line" style="display:flex;align-items:center;gap:8px;margin-top:6px;">
                <span style="font-size:10px;font-weight:700;color:#94a3b8;flex-shrink:0;width:42px;">OpenID</span>
                <code class="yyb-openid-text" style="flex:1;word-break:break-all;font-size:11px;">${esc(raw) || '-'}</code>
                <button type="button" class="yyb-copy-btn" data-yyb-copy="${attrEsc(raw)}" style="border:1px solid #c7d2fe;border-radius:6px;padding:4px 10px;font-size:12px;background:#eef2ff;color:#4f46e5;cursor:pointer;">复制</button>
            </div>
            <div class="yyb-acc-uin-line" style="display:flex;align-items:center;gap:8px;margin-top:6px;">
                <span style="font-size:10px;font-weight:700;color:#94a3b8;flex-shrink:0;width:42px;">UIN</span>
                <code class="yyb-uin-text" style="flex:1;font-size:11px;color:${uin ? '#334155' : '#94a3b8'};font-style:${uin ? 'normal' : 'italic'};" title="${uin ? attrEsc(uin) : '扫码绑定后自动获取；若仍为空请刷新账号'}">${esc(uin || '未获取')}</code>
                ${uin ? `<button type="button" class="yyb-copy-btn" data-yyb-copy="${attrEsc(uin)}" style="border:1px solid #c7d2fe;border-radius:6px;padding:4px 10px;font-size:12px;background:#eef2ff;color:#4f46e5;cursor:pointer;">复制</button>` : ''}
            </div>
            ${statusTag(acc.status)}
        </div>`;
    }).join('');
    grid.querySelectorAll('.acc-item').forEach(item => {
        item.onclick = (e) => {
            if (e.target.closest('.yyb-copy-btn')) return;
            state.selectedKey = item.dataset.key;
            syncSelected();
        };
    });
    syncSelected();
}

async function loadStatus() {
    const st = await request('/status');
    $('coinVal').textContent = st.coin ?? '-';
    $('scanCostVal').textContent = st.scanLoginCost ?? '-';
    const chip = $('healthChip');
    if (!st.enabled || !st.ready) {
        chip.className = 'chip bad';
        $('healthText').textContent = st.message || '服务不可用';
        $('scanBtn').disabled = true;
    } else {
        chip.className = 'chip ok';
        $('healthText').textContent = '服务正常';
        $('scanBtn').disabled = false;
    }
    state.accounts = st.accounts || [];
    renderAccounts();
}

function togglePayload() {
    $('payloadGroup').classList.toggle('hidden', $('featureSel').value.toLowerCase() !== 'operatewxdata');
}

async function callFeature() {
    const acc = selectedAccount();
    if (!acc) { setResult('请先选择一个账号', true); return; }
    const feature = $('featureSel').value;
    const appId = $('appidInput').value.trim();
    if (!appId) { setResult('请输入 AppID', true); return; }
    const body = { ref: accountRef(acc), appId };
    let path = '/wxapp/getCode';
    if (feature === 'getPhoneNumber') path = '/wxapp/getPhoneNumber';
    if (feature === 'operateWxData') {
        path = '/wxapp/operateWxData';
        try { body.payload = JSON.parse($('payloadInput').value || '{}'); }
        catch { setResult('JSON 格式错误', true); return; }
    }
    $('callBtn').disabled = true;
    setResult('调用中…', false);
    try {
        const result = await request(path, { method: 'POST', body: JSON.stringify(body) });
        setResult(result, false);
        await loadStatus();
    } catch (e) {
        setResult(e.message, true);
    } finally {
        $('callBtn').disabled = false;
    }
}

async function refreshSelected() {
    const acc = selectedAccount();
    if (!acc) { setResult('请先选择一个账号', true); return; }
    try {
        await withAccountAction($('refreshBtn'), '刷新中…', '正在刷新存活状态，请稍候…', async () => {
            const r = await request('/accounts/refresh', { method: 'POST', body: JSON.stringify({ ref: accountRef(acc) }) });
            setResult(r, false);
            await loadStatus();
        });
    } catch (e) { setResult(e.message, true); }
}

async function resyncSelected() {
    const acc = selectedAccount();
    if (!acc) { setResult('请先选择一个账号', true); return; }
    try {
        await withAccountAction($('resyncBtn'), '同步中…', '正在同步账号资料，请稍候…', async () => {
            const r = await request('/accounts/resync', { method: 'POST', body: JSON.stringify({ ref: accountRef(acc) }) });
            setResult(r, false);
            await loadStatus();
        });
    } catch (e) { setResult(e.message, true); }
}

async function deleteSelected() {
    const acc = selectedAccount();
    if (!acc || !confirm('确定删除该账号？')) return;
    try {
        await request('/accounts/delete', { method: 'POST', body: JSON.stringify({ ref: accountRef(acc) }) });
        await loadStatus();
    } catch (e) { setResult(e.message, true); }
}

function stopScanPoll() {
    if (state.scanTimer) { clearTimeout(state.scanTimer); state.scanTimer = null; }
    state.scanPolling = false;
}

function scheduleScanPoll(delay) {
    if (state.scanTimer) clearTimeout(state.scanTimer);
    state.scanTimer = setTimeout(() => { void pollScan(); }, delay);
}

function closeQr() {
    $('qrModal').classList.remove('show');
    stopScanPoll();
}

async function pollScan() {
    if (!state.scanSessionId || state.scanPolling) return;
    state.scanPolling = true;
    let keepPolling = false;
    try {
        const data = await request('/qr/' + encodeURIComponent(state.scanSessionId) + '/poll');
        const status = (data.status || '').toLowerCase();
        if (status === 'scanned') {
            $('qrHint').textContent = '已扫码，请在手机上点击「确认登录」';
            keepPolling = true;
            return;
        }
        if (status === 'authorized' || status === 'confirmed') {
            stopScanPoll();
            $('qrHint').textContent = '正在完成绑定…';
            await request('/qr/' + encodeURIComponent(state.scanSessionId) + '/confirm', { method: 'POST' });
            closeQr();
            setResult('扫码登录成功，账号已绑定。', false);
            await loadStatus();
            return;
        }
        if (['expired', 'cancelled', 'unknown'].includes(status)) {
            stopScanPoll();
            $('qrHint').textContent = status === 'expired' ? '二维码已过期，请重新生成' : '扫码已取消';
            return;
        }
        keepPolling = true;
    } catch (e) {
        const msg = e.message || '';
        if (/deadline|timeout/i.test(msg)) {
            $('qrHint').textContent = '等待扫码中（网络较慢）…';
            keepPolling = true;
            return;
        }
        stopScanPoll();
        $('qrHint').textContent = msg || '登录失败';
        setResult(msg || '扫码确认失败', true);
    } finally {
        state.scanPolling = false;
        if (keepPolling && state.scanSessionId) scheduleScanPoll(800);
    }
}

async function startScan() {
    try {
        const data = await request('/qr', { method: 'POST' });
        state.scanSessionId = data.sessionId;
        const src = qrImgSrc(data.imageBase64);
        $('qrBox').innerHTML = src ? `<img src="${src}" alt="二维码">` : '加载失败';
        $('qrHint').textContent = '本次消耗 ' + (data.scanLoginCost ?? '-') + ' 积分';
        $('qrModal').classList.add('show');
        stopScanPoll();
        scheduleScanPoll(0);
    } catch (e) { setResult(e.message, true); }
}

$('featureSel').onchange = togglePayload;
$('callBtn').onclick = callFeature;
$('clearBtn').onclick = () => setResult('结果已清空', false);
$('copyBtn').onclick = () => {
    const text = state.lastResult || $('resultBox').textContent || '';
    copyText(text, $('copyBtn'));
};
$('reloadBtn').onclick = loadStatus;
$('refreshBtn').onclick = refreshSelected;
$('resyncBtn').onclick = resyncSelected;
$('deleteBtn').onclick = deleteSelected;
$('scanBtn').onclick = startScan;
$('qrCloseBtn').onclick = closeQr;
togglePayload();
loadStatus();
</script>
</body>
</html>
