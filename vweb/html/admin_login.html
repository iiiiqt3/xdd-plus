<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大师曼控制台 - 登录</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --text: #f8fbff;
            --muted: rgba(226, 232, 240, 0.72);
            --line: rgba(255, 255, 255, 0.16);
            --cyan: #22d3ee;
            --blue: #3b82f6;
            --violet: #8b5cf6;
        }
        html { min-height: 100%; background: #050816; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(34, 211, 238, 0.34), transparent 28%),
                radial-gradient(circle at 82% 16%, rgba(139, 92, 246, 0.32), transparent 30%),
                radial-gradient(circle at 68% 86%, rgba(236, 72, 153, 0.22), transparent 28%),
                linear-gradient(135deg, #050816 0%, #0f172a 48%, #111827 100%);
            color: var(--text);
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle at center, #000 0%, transparent 72%);
        }
        .shell {
            position: relative;
            width: 100%;
            max-width: 440px;
            z-index: 1;
        }
        .card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.045));
            border: 1px solid var(--line);
            border-radius: 28px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 26px 80px rgba(0,0,0,0.36), inset 0 1px 0 rgba(255,255,255,0.16);
            padding: clamp(28px, 4vw, 40px);
        }
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(34,211,238,0.14), transparent 35%, rgba(139,92,246,0.12));
            opacity: 0.72;
            border-radius: 28px;
        }
        .card > * { position: relative; z-index: 1; }

        .logo { text-align: center; margin-bottom: 28px; }
        .logo .icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--cyan), var(--blue) 45%, var(--violet));
            border-radius: 16px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
        }
        .logo .icon svg { width: 28px; height: 28px; fill: #fff; }
        .logo h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 6px; text-shadow: 0 18px 48px rgba(34, 211, 238, 0.18); }
        .logo p { color: var(--muted); font-size: 13px; line-height: 1.6; }

        .mode-switch {
            display: flex;
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 22px;
        }
        .mode-switch .tab {
            flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 600;
            color: rgba(255,255,255,0.45); cursor: pointer; border-radius: 11px;
            transition: all 0.25s ease; user-select: none;
        }
        .mode-switch .tab.active {
            background: linear-gradient(135deg, var(--cyan), var(--blue) 45%, var(--violet));
            color: #fff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }

        .panel { display: none; }
        .panel.active { display: block; animation: panelIn 0.28s ease both; }
        @keyframes panelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { color: var(--text); font-size: 20px; font-weight: 900; margin-bottom: 6px; letter-spacing: -0.03em; }
        .section-desc { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 20px; }

        .field { margin-bottom: 16px; }
        .field label { display: block; color: rgba(226,232,240,0.78); font-size: 13px; margin-bottom: 7px; font-weight: 700; }
        .field input {
            width: 100%; height: 48px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.13); background: rgba(2, 6, 23, 0.36);
            color: #fff; padding: 0 14px; outline: none; font-size: 15px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        .field input:focus {
            border-color: rgba(34, 211, 238, 0.72);
            background: rgba(2, 6, 23, 0.52);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.12), 0 10px 28px rgba(34, 211, 238, 0.08);
        }
        .field input::placeholder { color: rgba(226,232,240,0.36); }

        .btn {
            width: 100%; height: 50px; margin-top: 10px; font-size: 15px; font-weight: 900;
            color: #fff; border: none; border-radius: 16px; cursor: pointer;
            background: linear-gradient(135deg, var(--cyan), var(--blue) 45%, var(--violet));
            box-shadow: 0 18px 34px rgba(59, 130, 246, 0.32);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            letter-spacing: 0.02em;
        }
        .btn:hover { transform: translateY(-2px); filter: saturate(1.08); box-shadow: 0 22px 42px rgba(59, 130, 246, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn.loading { opacity: 0.65; pointer-events: none; transform: none; }

        .fail-bar { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; margin-top: 14px; overflow: hidden; }
        .fail-bar .fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #f59e0b, #ef4444); transition: width 0.35s ease; width: 0%; }

        .lock-overlay {
            display: none; position: absolute; inset: 0;
            background: rgba(15, 12, 41, 0.88); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 28px; z-index: 20;
            flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        }
        .lock-overlay.show { display: flex; }
        .lock-overlay .lock-icon { width: 48px; height: 48px; fill: rgba(239, 68, 68, 0.8); }
        .lock-overlay .lock-text { color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500; }
        .lock-overlay .lock-countdown { color: rgba(239,68,68,0.92); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .lock-overlay .lock-hint { color: rgba(255,255,255,0.35); font-size: 12px; }

        .toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-80px);
            padding: 12px 24px; border-radius: 12px; font-size: 13px; color: #fff; z-index: 999;
            transition: transform 0.4s, opacity 0.4s; opacity: 0; pointer-events: none; white-space: nowrap;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: rgba(239, 68, 68, 0.92); }
        .toast.success { background: rgba(34, 197, 94, 0.92); }
        .toast.warn { background: rgba(245, 158, 11, 0.92); }

        .user-link {
            text-align: center;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .user-link a {
            color: rgba(226,232,240,0.42); font-size: 12px; cursor: pointer;
            text-decoration: none; transition: color 0.15s ease;
        }
        .user-link a:hover { color: rgba(226,232,240,0.72); }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .shell { max-width: 100%; }
            .card { border-radius: 22px; padding: 24px; }
            .field input { height: 46px; }
            .btn { height: 48px; }
            .logo h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="shell">
    <div class="card">
        <div class="logo">
            <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg></div>
            <h1>大师曼控制台</h1>
            <p>管理员登录入口</p>
        </div>

        <div class="mode-switch">
            <div class="tab active" data-panel="password">密码登录</div>
            <div class="tab" data-panel="token">授权码登录</div>
        </div>

        <!-- 密码登录 -->
        <div class="panel active" id="panel-password">
            <div class="section-title">账号密码登录</div>
            <div class="section-desc">使用管理员账号和密码登录</div>
            <form autocomplete="on" onsubmit="loginPassword(event)">
                <div class="field">
                    <label>管理员账号</label>
                    <input type="text" id="adminAccount" placeholder="请输入管理员账号" autocomplete="username" required />
                </div>
                <div class="field">
                    <label>管理员密码</label>
                    <input type="password" id="adminPassword" placeholder="请输入管理员密码" autocomplete="current-password" required />
                </div>
                <div class="fail-bar"><div class="fill" id="fail-fill-password"></div></div>
                <button type="submit" class="btn" id="btn-password">进入控制台</button>
            </form>
        </div>

        <!-- 授权码登录 -->
        <div class="panel" id="panel-token">
            <div class="section-title">授权码登录</div>
            <div class="section-desc">使用临时授权码快速登录</div>
            <form autocomplete="off" onsubmit="loginToken(event)">
                <div class="field">
                    <label>临时授权码</label>
                    <input type="text" id="adminToken" placeholder="请输入临时授权码" autocomplete="off" required />
                </div>
                <div class="fail-bar"><div class="fill" id="fail-fill-token"></div></div>
                <button type="submit" class="btn" id="btn-token">使用授权码登录</button>
            </form>
        </div>

        <!-- 锁定遮罩 -->
        <div class="lock-overlay" id="lockOverlay">
            <svg class="lock-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
            <div class="lock-text">登录已锁定</div>
            <div class="lock-countdown" id="lockCountdown">--</div>
            <div class="lock-hint">失败次数过多，请稍后再试</div>
        </div>

        <div class="user-link"><a onclick="window.location.href='/'">返回用户登录</a></div>
    </div>
</div>

<script>
var MAX_FAILS = 5;
var failCount = 0;
var lockTimer = null;

/* ---------- tab 切换 ---------- */
document.querySelectorAll('.mode-switch .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.mode-switch .tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
});

/* ---------- toast ---------- */
function showToast(msg, type) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

/* ---------- 失败进度条 ---------- */
function updateFailBar(count) {
    var pct = Math.min(count / MAX_FAILS * 100, 100);
    document.querySelectorAll('.fail-bar .fill').forEach(function(el) { el.style.width = pct + '%'; });
}

/* ---------- 锁定倒计时 ---------- */
function showLock(remaining) {
    document.getElementById('lockOverlay').classList.add('show');
    var sec = Math.ceil(remaining);
    updateCountdownText(sec);
    if (lockTimer) clearInterval(lockTimer);
    lockTimer = setInterval(function() {
        sec--;
        if (sec <= 0) {
            clearInterval(lockTimer);
            lockTimer = null;
            document.getElementById('lockOverlay').classList.remove('show');
            failCount = 0;
            updateFailBar(0);
            checkStatus();
        } else {
            updateCountdownText(sec);
        }
    }, 1000);
}

function updateCountdownText(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    document.getElementById('lockCountdown').textContent = (m > 0 ? m + '分' : '') + s + '秒';
}

/* ---------- 检查锁定状态 ---------- */
function checkStatus() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/login/status', true);
    xhr.onload = function() {
        try {
            var data = JSON.parse(xhr.responseText);
            if (data.locked && data.remaining > 0) {
                failCount = MAX_FAILS;
                updateFailBar(MAX_FAILS);
                showLock(data.remaining);
            }
        } catch(e) {}
    };
    xhr.send();
}
checkStatus();

/* ---------- 通用登录请求 ---------- */
function doLogin(params, btnId) {
    var btn = document.getElementById(btnId);
    var originText = btn.textContent;
    btn.classList.add('loading');
    btn.textContent = '登录中...';
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/login/admin', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onload = function() {
        btn.classList.remove('loading');
        btn.textContent = originText;
        var text = xhr.responseText.trim();
        if (xhr.status === 200 && text === '登录') {
            failCount = 0;
            updateFailBar(0);
            showToast('登录成功', 'success');
            setTimeout(function() { window.location.href = '/admin'; }, 500);
            return;
        }
        try {
            var data = JSON.parse(text);
            failCount = data.fails || (failCount + 1);
            updateFailBar(failCount);
            if (data.code === 2) {
                showToast(data.msg, 'error');
                showLock(data.remaining);
            } else {
                showToast(data.msg || '登录失败', 'error');
                if (failCount >= MAX_FAILS) showLock(600);
            }
        } catch(e) {
            failCount++;
            updateFailBar(failCount);
            showToast('登录失败', 'error');
        }
    };
    xhr.onerror = function() {
        btn.classList.remove('loading');
        btn.textContent = originText;
        showToast('网络错误，请重试', 'error');
    };
    xhr.send(params);
}

/* ---------- 密码登录 ---------- */
function loginPassword(e) {
    e.preventDefault();
    var account = document.getElementById('adminAccount').value.trim();
    var password = document.getElementById('adminPassword').value;
    if (!account || !password) { showToast('请填写账号和密码', 'error'); return; }
    doLogin('type=admin&account=' + encodeURIComponent(account) + '&pin=' + encodeURIComponent(password), 'btn-password');
}

/* ---------- 授权码登录 ---------- */
function loginToken(e) {
    e.preventDefault();
    var token = document.getElementById('adminToken').value.trim();
    if (!token) { showToast('请输入授权码', 'error'); return; }
    doLogin('type=admin&account=&pin=' + encodeURIComponent(token), 'btn-token');
}
</script>
</body>
</html>
